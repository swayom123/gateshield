[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gateshield"
version = "0.1.0"
description = "A defensive security gateway for LLM applications"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "opentelemetry-api>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "asgi-lifespan>=2.1,<3", "types-jsonschema>=4.23,<5"]
observability = ["opentelemetry-sdk>=1.24,<2", "opentelemetry-exporter-otlp-proto-http>=1.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["gateshield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

